<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- link google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-green-800 font-['Roboto']">

    <!-- title -->
    <div class="container mx-auto scale-90">
        <div class="bg-green-600 text-slate-200 shadow-xl max-w-fit mt-3 mx-auto rounded-4xl px-5 py-3">
            <h1 class="text-center font-bold text-xl capitalize">crafting lane</h1>
            <p class="text-center text-sm font-semibold">put the used items you have in the striped box</p>
        </div>
    </div>
    
    <!-- scroll section -->
    <div class="container scale-90 flex justify-center items-center mx-auto">
        <div class="card-wrapper flex mt-10 mx-auto relative">
            <!-- icons left backward -->
            <span id="left" class="icons bg-green-600 w-fit absolute rounded-xl -left-2 top-1/2 z-10 -translate-y-1/2 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#fff"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/></svg>
            </span>
            <ul class="carousel flex grid-flow-col max-w-[425px] lg:max-w-4xl lg:auto-cols-[50%] xl:auto-cols-auto xl:max-w-6xl auto-cols-[100%] overflow-hidden scroll-smooth relative">
                <!-- Cards will be populated dynamically -->
            </ul>

            <!-- right arrow forward -->
            <span id="right" class="icons bg-green-600 w-fit absolute -right-4 top-1/2 -translate-y-1/2 rounded-xl cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#fff"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg>
            </span>
        </div>
    </div>

    <!-- dropped section -->
    <div class="container mx-auto mb-5 mt-5">
        <h2 class="text-center bg-green-600 max-w-fit mx-auto px-5 py-2 rounded-4xl font-semibold text-slate-200 shadow-lg">put items</h2>
        <ul class="flex justify-evenly items-center flex-wrap drop-zones">
            <li>
                <div class="drop-zone mx-auto flex mt-5 w-[10em] h-[8em] place-items-center border-[0.25em] border-dashed border-slate-200 rounded-xl;" data-index="0"></div>
            </li>
            <li>
                <div class="drop-zone mx-auto flex mt-5 w-[10em] h-[8em] place-items-center border-[0.25em] border-dashed border-slate-200 rounded-xl;" data-index="1"></div>
            </li>
            <li>
                <div class="drop-zone mx-auto flex mt-5 w-[10em] h-[8em] place-items-center border-[0.25em] border-dashed border-slate-200 rounded-xl;" data-index="2"></div>
            </li>
        </ul>
    </div>

    <!-- Craft suggestions section -->
    <div class="container scale-90 flex justify-center items-center mx-auto mb-2">
        <div id="craft-suggestions" class="hidden">
            <h2 class="text-center bg-green-600 max-w-fit mx-auto px-5 py-2 rounded-4xl font-semibold text-slate-200 shadow-lg">Suggested Crafts</h2>
            <div class="card-wrapper flex mt-5 mx-auto relative">
                <!-- icons left backward for suggestions -->
                <span id="suggestions-left" class="icons bg-green-600 w-fit absolute rounded-xl -left-2 top-1/2 z-10 -translate-y-1/2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#fff"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/></svg>
                </span>
                <ul id="suggestions-list" class="carousel flex grid-flow-col max-w-[425px] lg:max-w-4xl lg:auto-cols-[50%] xl:auto-cols-auto xl:max-w-6xl auto-cols-[100%] overflow-hidden scroll-smooth relative">
                    <!-- Suggestions will be populated dynamically -->
                </ul>
                <!-- right arrow forward for suggestions -->
                <span id="suggestions-right" class="icons bg-green-600 w-fit absolute -right-4 top-1/2 -translate-y-1/2 rounded-xl cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#fff"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg>
                </span>
            </div>
        </div>
    </div>

    <!-- container -->
   <div id="craft-modal" class="fixed inset-0 bg-green-800 bg-opacity-70 hidden justify-center items-center z-50 ">
    
    <!-- wrapper -->
    <div class="bg-white rounded-2xl shadow-2xl p-6 m-4 max-w-lg w-full max-h-[90vh] overflow-y-auto transform transition-all duration-300">
        
        <!-- tittle -->
        <h3 id="craft-name" class="text-3xl font-bold text-slate-800 mb-4 pb-2"></h3>
        
        <!-- video tutorial -->
        <div class="mb-6">
            <h4 class="text-lg font-bold text-slate-700 mb-3">🎬 Video Tutorial:</h4>
            <div class="aspect-video">
                <iframe id="craft-video" width="100%" height="100%" src="" frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen class="rounded-xl shadow-xl"></iframe>
            </div>
        </div>
        
        <!-- steps -->
        <div class="mb-6">
            <h4 class="text-lg font-bold text-slate-700 mb-3">🛠️ Steps:</h4>
            <ol id="craft-steps" class="list-decimal list-outside space-y-2 ml-5 text-slate-600">
                </ol>
        </div>
        
        <!-- button close -->
        <div class="flex justify-end pt-4 border-t">
            <button id="close-modal" class="bg-green-600 hover:bg-green-700 px-10 py-2 text-white font-semibold rounded-lg transition duration-200 shadow-md">
                Tutup
            </button>
        </div>
        
    </div>
</div>
    <script src="../js/craft.js"></script>
</body>
</html>
